# Static client from dist/, the REST API as a Node.js Netlify Function
# (netlify/functions/api.ts, routed by its own `config.path` = /api/*).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Vite fingerprints everything under /assets, so it can be cached forever. Netlify sets
# headers per path, not per status, so a 404 under /assets gets this header too; that is
# accepted, because a fingerprinted name is never reused for a different file. (The Node
# server, which can, skips it on errors: see server/static.ts.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep in sync with serveClient() in server/static.ts, which the e2e tests run against.
# style-src allows 'unsafe-inline' because motion's popLayout injects a <style> element.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
